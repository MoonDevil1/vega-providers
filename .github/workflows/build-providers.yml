name: Build and test providers

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

concurrency:
  group: build-providers-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build provider bundles
        run: npm run build
      - name: Test providers
        run: npm test
      - name: Commit generated bundles
        run: |
          git add -f dist
          if ! git diff --cached --quiet -- dist; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build provider bundles"
            git pull --rebase origin main
            git push
          fi
